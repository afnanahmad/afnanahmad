<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Afnan Ahmad — Mobile &amp; ML Engineer</title>
  <desc id="desc">Mobile engineer with a PhD in deep learning for indoor localization. A phone navigating an indoor map of the Petrie Building, with nearby WiFi access points.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1714" />
      <stop offset="1" stop-color="#142C23" />
    </linearGradient>
    <radialGradient id="ambient">
      <stop stop-color="#BCF4CF" stop-opacity="0.11" />
      <stop offset="1" stop-color="#BCF4CF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="screen" x1="854" y1="41" x2="1026" y2="399" gradientUnits="userSpaceOnUse">
      <stop stop-color="#203E32" />
      <stop offset="1" stop-color="#12271F" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#BCF4CF" stroke-opacity="0.07" />
    </pattern>
    <linearGradient id="bezel" x1="845" y1="32" x2="1035" y2="408" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A3F35" />
      <stop offset="0.5" stop-color="#16251E" />
      <stop offset="1" stop-color="#25392F" />
    </linearGradient>
    <pattern id="mapgrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" stroke="#BCF4CF" stroke-opacity="0.06" />
    </pattern>
    <clipPath id="screenClip">
      <rect x="854" y="41" width="172" height="358" rx="29" />
    </clipPath>
    <filter id="soft" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="12" /></filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="438" rx="24" />
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="url(#background)" />
    <rect x="740" width="460" height="440" fill="url(#grid)" />
    <ellipse cx="965" cy="215" rx="290" ry="280" fill="url(#ambient)" />

    <g stroke="#BCF4CF">
      <circle cx="940" cy="215" r="170" stroke-opacity="0.1" />
      <circle cx="940" cy="215" r="133" stroke-opacity="0.16" stroke-dasharray="3 9" />
      <path d="M746 215H1134M940 28V402" stroke-opacity="0.08" />
      <path d="M784 113L940 215L1112 150M940 215L1096 338" stroke-opacity="0.2" stroke-dasharray="4 6" />
    </g>

    <!-- A native app showing an indoor floor plan and a location estimate. -->
    <ellipse cx="948" cy="400" rx="120" ry="16" fill="#000" fill-opacity="0.35" filter="url(#soft)" />
    <g transform="rotate(6 940 220)">
      <!-- hardware -->
      <rect x="841" y="104" width="4" height="26" rx="2" fill="#2B4237" />
      <rect x="841" y="144" width="4" height="44" rx="2" fill="#2B4237" />
      <rect x="841" y="196" width="4" height="44" rx="2" fill="#2B4237" />
      <rect x="1035" y="156" width="4" height="66" rx="2" fill="#2B4237" />
      <rect x="845" y="32" width="190" height="376" rx="38" fill="url(#bezel)" stroke="#4E6F5F" stroke-width="1.5" />
      <rect x="852" y="39" width="176" height="362" rx="31" fill="#08110D" />

      <g clip-path="url(#screenClip)">
        <rect x="854" y="41" width="172" height="358" fill="url(#screen)" />

        <!-- status bar -->
        <text x="874" y="65" class="sans" font-size="11.5" font-weight="600" fill="#F3F4E9">9:41</text>
        <g stroke="#F3F4E9" stroke-width="1.5" stroke-linecap="round" fill="none">
          <path d="M977 58.5a9 9 0 0 1 12 0M979.5 61.3a5.2 5.2 0 0 1 7 0" />
        </g>
        <circle cx="983" cy="64" r="1.3" fill="#F3F4E9" />
        <rect x="995" y="56" width="17" height="8.5" rx="2.5" fill="none" stroke="#F3F4E9" stroke-opacity="0.6" />
        <rect x="996.5" y="57.5" width="12" height="5.5" rx="1.5" fill="#F3F4E9" />
        <rect x="909" y="49" width="62" height="19" rx="9.5" fill="#050A08" />

        <!-- full-bleed map -->
        <rect x="854" y="41" width="172" height="358" fill="url(#mapgrid)" />

        <!-- building: lab + office, corridor, cafe / meeting / studio -->
        <rect x="860" y="108" width="160" height="198" rx="8" fill="#0E1F18" stroke="#3A5A4A" stroke-width="1.5" />
        <rect x="860" y="190" width="160" height="28" fill="#BCF4CF" fill-opacity="0.05" />
        <rect x="930" y="108" width="90" height="82" fill="#BCF4CF" fill-opacity="0.07" />
        <g stroke="#4C6E5D" stroke-width="1.3" stroke-linecap="round">
          <path d="M930 108V190" />
          <path d="M860 190H888M904 190H976M992 190H1020" />
          <path d="M860 218H880M896 218H936M950 218H984M998 218H1020" />
          <path d="M920 218V306M968 218V306" />
        </g>
        <g class="mono" font-size="6.5" fill="#6F8C7E" letter-spacing="0.6">
          <text x="867" y="121">OFFICE 314</text><text x="937" y="121" fill="#BCF4CF">LAB 312</text>
          <text x="899" y="231">CAFÉ</text><text x="925" y="231">MEETING</text><text x="975" y="231">STUDIO</text>
        </g>

        <!-- cafe point of interest -->
        <circle cx="906" cy="284" r="8" fill="#FFB094" fill-opacity="0.14" />
        <g stroke="#FFB094" stroke-width="1" fill="none" stroke-linecap="round">
          <path d="M902.5 281.5h6v4a2.5 2.5 0 0 1 -2.5 2.5h-1a2.5 2.5 0 0 1 -2.5 -2.5z" />
          <path d="M908.5 283h1a1.4 1.4 0 0 1 0 2.8h-1" />
        </g>

        <!-- walked so far: out of the cafe and into the corridor -->
        <circle cx="888" cy="298" r="2.5" fill="#BCF4CF" fill-opacity="0.6" />
        <path d="M888 294V218Q888 204 902 204H940" stroke="#BCF4CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.5 6" stroke-opacity="0.7" />

        <!-- route ahead: along the corridor and through the office door -->
        <path d="M948 204H970Q984 204 984 190V168" stroke="#BCF4CF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

        <!-- destination pin -->
        <path d="M984 168C984 168 974 157 974 151A10 10 0 1 1 994 151C994 157 984 168 984 168Z" fill="#FFB094" stroke="#0E1F18" stroke-width="1.5" />
        <circle cx="984" cy="151" r="3.5" fill="#0E1F18" />

        <!-- current position with heading -->
        <path d="M946 204L970 192A27 27 0 0 1 970 216Z" fill="#BCF4CF" fill-opacity="0.18" />
        <circle cx="946" cy="204" r="15" fill="#BCF4CF" fill-opacity="0.1" stroke="#BCF4CF" stroke-opacity="0.25" />
        <circle cx="946" cy="204" r="6.5" fill="#BCF4CF" stroke="#F3F4E9" stroke-width="2.5" />

        <!-- floating search bar with floor picker -->
        <rect x="862" y="74" width="156" height="26" rx="13" fill="#17322A" fill-opacity="0.96" stroke="#2F5040" />
        <circle cx="877" cy="86.5" r="3.6" fill="none" stroke="#A8BDB0" stroke-width="1.3" />
        <path d="M879.6 89.1L882 91.5" stroke="#A8BDB0" stroke-width="1.3" stroke-linecap="round" />
        <text x="887" y="90.5" class="sans" font-size="9.5" font-weight="600" fill="#F3F4E9">Petrie Building</text>
        <rect x="966" y="79" width="48" height="16" rx="8" fill="#0E1F18" />
        <rect x="997.5" y="80.5" width="17" height="13" rx="6.5" fill="#BCF4CF" />
        <g class="sans" font-size="8" font-weight="700" text-anchor="middle">
          <text x="973.5" y="90" fill="#A8BDB0">1</text><text x="989.5" y="90" fill="#A8BDB0">2</text><text x="1006" y="90" fill="#0C1714">3</text>
        </g>

        <!-- bottom sheet -->
        <rect x="854" y="314" width="172" height="90" rx="20" fill="#17322A" fill-opacity="0.97" stroke="#2F5040" />
        <rect x="926" y="321" width="28" height="3.5" rx="1.75" fill="#4E6F5F" />
        <text x="868" y="338" class="mono" font-size="7.5" letter-spacing="1.2" fill="#FFB094">DESTINATION</text>
        <text x="868" y="353" class="sans" font-size="13" font-weight="700" fill="#F3F4E9">Lab 312</text>
        <text x="1012" y="338" text-anchor="end" class="mono" font-size="7.5" letter-spacing="1.2" fill="#A8BDB0">ETA</text>
        <text x="1012" y="353" text-anchor="end" class="sans"><tspan font-size="9.5" fill="#A8BDB0">24 m · </tspan><tspan font-size="13" font-weight="700" fill="#BCF4CF">1 min</tspan></text>
        <rect x="866" y="364" width="94" height="22" rx="11" fill="none" stroke="#4E6F5F" />
        <text x="913" y="378.5" text-anchor="middle" class="sans" font-size="9.5" font-weight="600" fill="#F3F4E9">Overview</text>
        <rect x="966" y="364" width="48" height="22" rx="11" fill="#FFB094" />
        <text x="990" y="378.5" text-anchor="middle" class="sans" font-size="9.5" font-weight="700" fill="#0C1714">End</text>
        <rect x="914" y="393" width="52" height="3.5" rx="1.75" fill="#F3F4E9" fill-opacity="0.55" />
      </g>
      <!-- glass highlight -->
      <path d="M864 50C900 44 960 42 1000 46" stroke="#F3F4E9" stroke-opacity="0.08" stroke-width="2" stroke-linecap="round" />
    </g>

    <g>
      <circle cx="784" cy="113" r="6" fill="#FFB094" />
      <circle cx="784" cy="113" r="15" stroke="#FFB094" stroke-opacity="0.3" />
      <text x="784" y="143" text-anchor="middle" class="mono" font-size="9" letter-spacing="0.8" fill="#FFB094" fill-opacity="0.5">AirYorkGUEST</text>
      <circle cx="1112" cy="150" r="5" fill="#BCF4CF" />
      <circle cx="1112" cy="150" r="14" stroke="#BCF4CF" stroke-opacity="0.25" />
      <text x="1112" y="180" text-anchor="middle" class="mono" font-size="9" letter-spacing="0.8" fill="#BCF4CF" fill-opacity="0.45">eduroam</text>
      <circle cx="1096" cy="338" r="5" fill="#BCF4CF" />
      <circle cx="1096" cy="338" r="14" stroke="#BCF4CF" stroke-opacity="0.25" />
      <text x="1096" y="368" text-anchor="middle" class="mono" font-size="9" letter-spacing="0.8" fill="#BCF4CF" fill-opacity="0.45">AirYorkPLUS</text>
    </g>

    <circle cx="61" cy="58" r="4" fill="#BCF4CF" />
    <text x="77" y="63" class="mono" font-size="13" letter-spacing="2" fill="#BCF4CF">MOBILE &amp; ML ENGINEER</text>
    <text x="56" y="157" class="sans" font-size="78" font-weight="700" letter-spacing="-3" fill="#F3F4E9">Afnan Ahmad<tspan fill="#BCF4CF">.</tspan></text>
    <text x="60" y="222" class="sans" font-size="32" font-weight="500" letter-spacing="-0.5" fill="#F3F4E9">Mobile engineer with a PhD in</text>
    <text x="60" y="264" class="sans" font-size="32" font-weight="500" letter-spacing="-0.5" fill="#BCF4CF">deep learning for indoor localization.</text>
    <text x="61" y="312" class="sans" font-size="17" fill="#A8BDB0">Native iOS and Android apps, sensor fusion, and applied ML.</text>

    <path d="M60 352H696" stroke="#355044" />
    <text x="61" y="389" class="mono" font-size="12" letter-spacing="1.2" fill="#A8BDB0">iOS / ANDROID</text>
    <circle cx="235" cy="384" r="2" fill="#557565" />
    <text x="257" y="389" class="mono" font-size="12" letter-spacing="1.2" fill="#A8BDB0">APPLIED ML</text>
    <circle cx="399" cy="384" r="2" fill="#557565" />
    <text x="421" y="389" class="mono" font-size="12" letter-spacing="1.2" fill="#FFB094">PhD / INDOOR POSITIONING</text>
    <text x="1176" y="422" text-anchor="end" class="mono" font-size="9.5" letter-spacing="1" fill="#A8BDB0" fill-opacity="0.4">43.7736° N, 79.5069° W</text>
  </g>
  <rect x="1" y="1" width="1198" height="438" rx="24" stroke="#355044" />
</svg>
