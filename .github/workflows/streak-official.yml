name: Streak card (official, trial)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&background=0C1714&ring=BCF4CF&fire=FFB094&currStreakNum=F3F4E9&sideNums=F3F4E9&currStreakLabel=BCF4CF&sideLabels=BCF4CF&dates=A8BDB0&stroke=24352F&hide_border=true&border_radius=12&disable_animations=true
          path: assets/streak-official.svg
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/streak-official.svg
          git commit -m "Update official streak card" || exit 0
          git push
